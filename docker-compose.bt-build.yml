# 数据库：宝塔 PostgreSQL（宿主机）。不使用 internal 网络，否则容器无法访问宿主机库。
# 基础镜像走华为云 SWR
services:
  mupi-nginx:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/library/nginx:alpine
    container_name: mupi-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - mupi-api
    networks:
      - internal_net

  mupi-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mupi-api
    restart: always
    env_file:
      - .env.production
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3001:3001"
    depends_on:
      - mupi-redis
    networks:
      - internal_net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const port=process.env.PORT||3001;fetch('http://127.0.0.1:'+port+'/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1));\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  mupi-redis:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/library/redis:7-alpine
    container_name: mupi-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./data/redis:/data
    networks:
      - internal_net

networks:
  internal_net:
    driver: bridge
