version: "3.9"

services:
  mupi-nginx:
    image: nginx:alpine
    container_name: mupi-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - mupi-api
    networks:
      - internal_net

  mupi-api:
    image: ${MUPI_API_IMAGE:-novcce/muni-api:latest}
    container_name: mupi-api
    restart: always
    env_file:
      - .env.production
    ports:
      - "3000:3000"
    depends_on:
      - mupi-db
      - mupi-redis
    networks:
      - internal_net
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const port=process.env.PORT||3000;fetch('http://127.0.0.1:'+port+'/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1));\""]
      interval: 30s
      timeout: 5s
      retries: 3

  mupi-db:
    image: postgres:16-alpine
    container_name: mupi-db
    restart: always
    env_file:
      - .env.production
    environment:
      # 建议在 .env.production 中配置：
      # DB_USERNAME, DB_PASSWORD, DB_DATABASE
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - internal_net

  mupi-redis:
    image: redis:7-alpine
    container_name: mupi-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./data/redis:/data
    networks:
      - internal_net

networks:
  internal_net:
    driver: bridge
    internal: true

